services:
  - type: web
    name: lifebridge-ai-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DB_DRIVER
        value: postgres
      - key: AUTO_SEED_EMPTY_DB
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: lifebridge-ai-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: AUDIT_HMAC_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://kodelageethika.github.io
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-4-hydrogen
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: lifebridge-ai-db
    plan: free
    databaseName: lifebridge_ai
    user: lifebridge
